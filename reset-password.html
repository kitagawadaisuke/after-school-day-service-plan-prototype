<!doctype html>
<html lang="ja">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>みちのーと｜パスワード設定</title><link rel="stylesheet" href="styles/saas.css"></head>
  <body class="login-page"><main class="login-card" aria-labelledby="password-setup-title">
    <p class="eyebrow">みちのーと</p><h1 id="password-setup-title">パスワードを設定</h1>
    <p id="password-setup-description">登録済みのメールアドレスへ、設定用リンクを送信します。</p>
    <form id="password-request-form" novalidate><label>メールアドレス<input name="email" type="email" autocomplete="email" required></label><p id="password-request-error" role="alert" hidden></p><button type="submit">設定用メールを送る</button></form>
    <form id="password-setup-form" novalidate hidden><label>新しいパスワード<input name="password" type="password" autocomplete="new-password" minlength="8" required></label><label>新しいパスワード（確認）<input name="passwordConfirmation" type="password" autocomplete="new-password" minlength="8" required></label><p id="password-setup-error" role="alert" hidden></p><button type="submit">パスワードを保存</button></form>
    <p><a href="/login.html">ログインへ戻る</a></p>
  </main><script type="module" src="src/password-setup.js"></script></body>
</html>
