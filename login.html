<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>みちのーと｜ログイン</title>
    <link rel="stylesheet" href="styles/saas.css">
  </head>
  <body class="login-page">
    <main class="login-card" aria-labelledby="login-title">
      <p class="eyebrow">みちのーと</p>
      <h1 id="login-title">ログイン</h1>
      <p>事業所から発行されたメールアドレスとパスワードを入力してください。</p>
      <form id="local-login-form" novalidate>
        <label>メールアドレス<input name="email" type="email" autocomplete="username" required></label>
        <label>パスワード<input name="password" type="password" autocomplete="current-password" required minlength="12"></label>
        <p id="login-error" role="alert" hidden></p>
        <button type="submit">ログイン</button>
      </form>
    </main>
    <script type="module" src="src/local-login.js"></script>
  </body>
</html>
