<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>放課後デイサービス COCO｜ログイン</title>
    <link rel="stylesheet" href="styles/saas.css">
  </head>
  <body class="login-page">
    <main class="login-card" aria-labelledby="login-title">
      <header class="login-header">
        <div class="login-brand" aria-label="放課後等デイサービス デモ">
          <span class="login-brand-mark" aria-hidden="true">C</span>
          <span><small>放課後等デイサービス</small><strong>COCO</strong></span>
        </div>
        <p class="login-kicker">COCO 支援記録・計画</p>
        <h1 id="login-title">ログイン</h1>
        <p class="login-intro">登録したメールアドレスとパスワードを入力してください。</p>
      </header>
      <form id="local-login-form" novalidate>
        <label for="login-email">メールアドレス</label>
        <input id="login-email" name="email" type="email" autocomplete="username" required aria-describedby="login-error">
        <label for="login-password">パスワード</label>
        <input id="login-password" name="password" type="password" autocomplete="current-password" required minlength="8" aria-describedby="login-error">
        <p id="login-error" role="alert" aria-live="assertive" hidden></p>
        <button type="submit" class="login-submit">ログイン</button>
      </form>
      <nav class="login-actions" aria-label="ログインに関する操作">
        <a href="/reset-password.html">パスワードを忘れた場合</a>
        <p><span>初めて利用する方</span><a href="/signup.html">新規登録</a></p>
      </nav>
    </main>
    <script type="module" src="src/local-login.js"></script>
  </body>
</html>
